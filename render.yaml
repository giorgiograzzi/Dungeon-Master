services:
  - type: web
    name: dungeon-master-tascabile
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: DAILY_TURN_CAP
        value: "50"
      - key: MODEL_NARRATOR
        value: claude-haiku-4-5-20251001
      - key: MODEL_CLIMAX
        value: claude-sonnet-5
      - key: RULE_WEAPON_SWAP_COST
        value: action
